apiVersion: v1
kind: Pod
metadata:
  name: t4-scheduling-test
  namespace: project4
spec:
  restartPolicy: Never

  nodeSelector:
    nvidia.com/gpu.product: Tesla-T4

  tolerations:
    - key: "nvidia.com/gpu"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"

  containers:
    - name: cuda-test
      image: nvcr.io/nvidia/k8s/cuda-sample:vectoradd-cuda12.5.0-ubuntu22.04

      resources:
        limits:
          nvidia.com/gpu: 1