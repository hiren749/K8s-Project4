apiVersion: v1
kind: ConfigMap
metadata:
  name: gpu-timeslicing-config
  namespace: kube-system

data:
  config.yaml: |
    version: v1
    sharing:
      timeSlicing:
        renameByDefault: false
        failRequestsGreaterThanOne: true
        resources:
          - name: nvidia.com/gpu
            replicas: 4