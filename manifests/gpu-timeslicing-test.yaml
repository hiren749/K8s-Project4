apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-timeslicing-test
  namespace: project4
spec:
  replicas: 4

  selector:
    matchLabels:
      app: gpu-timeslicing-test

  template:
    metadata:
      labels:
        app: gpu-timeslicing-test

    spec:
      nodeSelector:
        nvidia.com/gpu.product: Tesla-T4-SHARED

      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"

      containers:
        - name: gpu-workload
          image: nvidia/cuda:12.5.0-base-ubuntu22.04

          command:
            - /bin/bash
            - -c
            - |
              nvidia-smi
              echo "GPU time-slicing workload running..."
              sleep 3600

          resources:
            limits:
              nvidia.com/gpu: 1