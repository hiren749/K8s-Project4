apiVersion: v1
kind: Pod
metadata:
  name: real-gpu-workload
  namespace: project4
spec:
  restartPolicy: Never

  nodeSelector:
    accelerator: nvidia

  tolerations:
    - key: "nvidia.com/gpu"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"

  containers:
    - name: cuda-workload
      image: nvcr.io/nvidia/k8s/cuda-sample:vectoradd-cuda12.5.0-ubuntu22.04

      resources:
        limits:
          nvidia.com/gpu: 1