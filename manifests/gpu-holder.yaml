apiVersion: v1
kind: Pod
metadata:
  name: gpu-holder
  namespace: project4
spec:
  restartPolicy: Never

  nodeSelector:
    accelerator: nvidia

  tolerations:
    - key: "nvidia.com/gpu"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"

  containers:
    - name: gpu-holder
      image: nvidia/cuda:12.5.0-base-ubuntu22.04

      command:
        - /bin/bash
        - -c
        - |
          nvidia-smi
          echo "Holding GPU for scheduling test..."
          sleep 3600

      resources:
        limits:
          nvidia.com/gpu: 1