apiVersion: v1
kind: Namespace
metadata:
  name: project4

---
apiVersion: v1
kind: Pod
metadata:
  name: cuda-vectoradd
  namespace: project4
  labels:
    app: cuda-vectoradd
    project: kubernetes-project4
spec:
  restartPolicy: OnFailure

  containers:
    - name: cuda-vectoradd
      image: nvcr.io/nvidia/k8s/cuda-sample:vectoradd-cuda12.5.0-ubuntu22.04

      resources:
        limits:
          nvidia.com/gpu: 1