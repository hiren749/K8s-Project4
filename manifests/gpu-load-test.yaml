apiVersion: v1
kind: Pod
metadata:
  name: gpu-load-test
  namespace: project4
spec:
  restartPolicy: Never

  nodeSelector:
    accelerator: nvidia

  tolerations:
    - key: "nvidia.com/gpu"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"

  containers:
    - name: gpu-load
      image: pytorch/pytorch:2.5.1-cuda12.4-cudnn9-runtime

      command:
        - python
        - -c
        - |
          import torch
          import time

          print("CUDA available:", torch.cuda.is_available())
          print("GPU:", torch.cuda.get_device_name(0))

          a = torch.randn(6000, 6000, device="cuda")
          b = torch.randn(6000, 6000, device="cuda")

          end = time.time() + 300

          while time.time() < end:
              c = torch.matmul(a, b)
              torch.cuda.synchronize()

          print("GPU load test complete")

      resources:
        limits:
          nvidia.com/gpu: 1