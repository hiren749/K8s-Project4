apiVersion: v1
kind: Pod
metadata:
  name: gpu-taint-toleration-test
  namespace: project4
spec:
  nodeSelector:
    accelerator: nvidia

  tolerations:
    - key: "nvidia.com/gpu"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"

  containers:
    - name: nginx
      image: nginx:latest

  restartPolicy: Never